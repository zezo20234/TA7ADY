<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Locked Calendar (Admin 555)</title>
<style>
  :root{--bg:#ffffff;--panel:#0f1720;--muted:#9aa4b2;--accent:#06b6d4;--white:#fff;}
  html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:var(--bg)}
  .centerWrap{height:100%;display:flex;align-items:center;justify-content:center}
  .blankCard{width:100%;max-width:960px;height:640px;background:#fff;border:2px solid #eee;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
  .titleBig{font-size:22px;font-weight:800;color:#111;margin-bottom:6px}
  .sub{color:#666;font-size:14px}
  .codeBtn{margin-top:14px;padding:12px 18px;border-radius:10px;border:0;background:#111;color:#fff;cursor:pointer;font-weight:700}

  /* calendar styles */
  #calendarApp{display:none;width:100%;height:100%;background:linear-gradient(180deg,#061426,#081920);color:var(--white);padding:18px;box-sizing:border-box;border-radius:8px}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .nav{display:flex;gap:8px;align-items:center}
  .nav button{background:transparent;border:1px solid rgba(255,255,255,0.06);color:inherit;padding:8px 10px;border-radius:8px;cursor:pointer}
  .monthYear{font-size:18px;font-weight:700}
  .layout{display:grid;grid-template-columns:1fr 320px;gap:14px;height:calc(100% - 62px)}
  .calendarPanel{background:rgba(255,255,255,0.03);padding:12px;border-radius:10px;display:flex;flex-direction:column}
  .weekDays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:#93a2b3;font-size:12px;margin-bottom:6px}
  .daysGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;flex:1}
  .dayCell{padding:10px;border-radius:8px;min-height:64px;background:transparent;cursor:pointer;position:relative;color:var(--white);box-sizing:border-box}
  .dayNumber{font-weight:700}
  .dayCell:hover{outline:1px solid rgba(255,255,255,0.04)}
  .today{box-shadow:0 0 0 2px rgba(6,182,212,0.12);border-radius:8px}
  .hasEventDot{position:absolute;right:8px;bottom:8px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .sidebar{background:rgba(255,255,255,0.02);padding:12px;border-radius:10px;display:flex;flex-direction:column}
  .addBtn{background:var(--accent);color:#012;border:0;padding:10px;border-radius:8px;cursor:pointer;font-weight:700;margin-bottom:8px}
  .list{overflow:auto;flex:1;padding-right:6px}
  .eventItem{background:rgba(255,255,255,0.02);padding:8px;border-radius:8px;margin-bottom:8px}
  .small{font-size:12px;color:#9aa4b2}

  /* modal */
  .modalBg{position:fixed;inset:0;background:rgba(2,6,23,0.6);display:none;align-items:center;justify-content:center;z-index:50}
  .modal{background:#071126;padding:16px;border-radius:12px;min-width:320px;color:var(--white)}
  .formRow{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  input,textarea,select{background:#071126;border:1px solid rgba(255,255,255,0.04);padding:8px;border-radius:8px;color:var(--white);outline:0}
  textarea{min-height:80px;resize:vertical}

  /* small helper */
  .mutedSmall{color:#94a3b8;font-size:13px}
  @media (max-width:860px){ .layout{grid-template-columns:1fr} .sidebar{order:2} .calendarPanel{order:1} }
</style>
</head>
<body>

<div class="centerWrap">
  <div class="blankCard" id="lockedScreen">
    <div style="text-align:center;">
      <div class="titleBig">This page is locked</div>
      <div class="sub">Enter the admin code to view the calendar.</div>
      <button class="codeBtn" id="enterCodeBtn">Enter Admin Code</button>
    </div>
  </div>

  <div id="calendarApp">
    <div class="header">
      <div>
        <div class="monthYear" id="monthYearLabel">Month Year</div>
        <div class="small">Admin view — add, edit and delete events</div>
      </div>
      <div class="nav">
        <button id="prevMonth">&larr;</button>
        <button id="nextMonth">&rarr;</button>
        <button id="jumpToday">Today</button>
        <button id="logoutBtn" style="background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px;border-radius:8px;color:#fff">Logout</button>
      </div>
    </div>

    <div class="layout">
      <div class="calendarPanel">
        <div class="weekDays">
          <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div class="daysGrid" id="daysGrid"></div>
      </div>

      <div class="sidebar">
        <button class="addBtn" id="openAdd">+ Add event</button>
        <div class="small" style="margin-bottom:8px">Selected date: <span id="selectedDateLabel">—</span></div>
        <div class="list" id="eventsList">
          <div class="mutedSmall">No events yet.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- modal -->
<div class="modalBg" id="modalBg">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-weight:800" id="modalTitle">Add Event</div>
      <div style="font-size:12px;color:#94a3b8" id="modalHint">Admin</div>
    </div>
    <div class="formRow">
      <label class="small">Title</label>
      <input id="evtTitle" placeholder="Event title"/>
    </div>
    <div class="formRow">
      <label class="small">Description</label>
      <textarea id="evtDesc" placeholder="Details..."></textarea>
    </div>
    <div class="formRow" style="flex-direction:row;gap:8px">
      <div style="flex:1">
        <label class="small">Year</label>
        <select id="selYear"></select>
      </div>
      <div style="flex:1">
        <label class="small">Month</label>
        <select id="selMonth"></select>
      </div>
    </div>
    <div class="formRow" style="flex-direction:row;gap:8px">
      <div style="flex:1">
        <label class="small">Day</label>
        <select id="selDay"></select>
      </div>
      <div style="flex:1">
        <label class="small">Time (HH:MM)</label>
        <input id="evtTime" placeholder="15:30"/>
      </div>
    </div>

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
      <button class="codeBtn" id="closeModal" style="background:#111;color:#fff;padding:8px 12px">Cancel</button>
      <button class="codeBtn" id="saveEvent" style="background:var(--accent);color:#012;padding:8px 12px">Save</button>
    </div>
  </div>
</div>

<!-- admin code modal -->
<div class="modalBg" id="codeModal">
  <div class="modal">
    <div style="font-weight:800;margin-bottom:6px">Enter Admin Code</div>
    <div class="formRow">
      <input id="adminCodeInput" placeholder="Enter code (e.g. 555)" />
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button class="codeBtn" id="closeCodeModal" style="background:#111;color:#fff">Cancel</button>
      <button class="codeBtn" id="submitCode" style="background:var(--accent);color:#012">Unlock</button>
    </div>
  </div>
</div>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAdmiUcQ_yZDL4Gg0r93HjqzPYQ6N-gzM8",
  authDomain: "the-challenge-fa9b2.firebaseapp.com",
  databaseURL: "https://the-challenge-fa9b2-default-rtdb.firebaseio.com",
  projectId: "the-challenge-fa9b2",
  storageBucket: "the-challenge-fa9b2.firebasestorage.app",
  messagingSenderId: "4102830619",
  appId: "1:4102830619:web:581e033f36ec02708916be",
  measurementId: "G-7M7JLK1V86"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* UI refs */
const lockedScreen = document.getElementById('lockedScreen');
const calendarApp = document.getElementById('calendarApp');
const enterCodeBtn = document.getElementById('enterCodeBtn');
const codeModal = document.getElementById('codeModal');
const closeCodeModal = document.getElementById('closeCodeModal');
const submitCode = document.getElementById('submitCode');
const adminCodeInput = document.getElementById('adminCodeInput');
const logoutBtn = document.getElementById('logoutBtn');

/* Calendar refs */
const daysGrid = document.getElementById('daysGrid');
const monthYearLabel = document.getElementById('monthYearLabel');
const selectedDateLabel = document.getElementById('selectedDateLabel');
const eventsList = document.getElementById('eventsList');
const openAdd = document.getElementById('openAdd');
const modalBg = document.getElementById('modalBg');
const closeModal = document.getElementById('closeModal');
const saveEventBtn = document.getElementById('saveEvent');

const selYear = document.getElementById('selYear');
const selMonth = document.getElementById('selMonth');
const selDay = document.getElementById('selDay');

let calendarInitialized = false;
let eventsCache = {};
let viewDate = new Date();
let selectedDate = new Date();

function pad(n){return (n<10? '0':'')+n}

/* Admin flow */
enterCodeBtn.addEventListener('click', ()=> { codeModal.style.display='flex'; adminCodeInput.value=''; adminCodeInput.focus(); });
closeCodeModal.addEventListener('click', ()=> codeModal.style.display='none');
submitCode.addEventListener('click', ()=> {
  const val = adminCodeInput.value.trim();
  if(val === '555'){
    localStorage.setItem('isAdmin','1');
    codeModal.style.display='none';
    revealCalendar();
    alert('Admin unlocked — you can now view and edit the calendar.');
  } else {
    alert('Wrong code');
  }
});

logoutBtn.addEventListener('click', ()=> { localStorage.removeItem('isAdmin'); location.reload(); });

/* Auto unlock if already admin */
if(localStorage.getItem('isAdmin')){
  revealCalendar();
}

function revealCalendar(){ lockedScreen.style.display='none'; calendarApp.style.display='block'; initializeCalendar(); }

/* Calendar basic functions */
document.getElementById('prevMonth').addEventListener('click', ()=> { viewDate.setMonth(viewDate.getMonth()-1); renderCalendar(); });
document.getElementById('nextMonth').addEventListener('click', ()=> { viewDate.setMonth(viewDate.getMonth()+1); renderCalendar(); });
document.getElementById('jumpToday').addEventListener('click', ()=> { viewDate = new Date(); selectedDate = new Date(); renderCalendar(); updateSelectedDate(); });
openAdd.addEventListener('click', ()=> openAddModal());
closeModal.addEventListener('click', ()=> modalBg.style.display='none');
saveEventBtn.addEventListener('click', saveEvent);

function fillYearMonthDaySelectors(y,m,d){
  selYear.innerHTML='';
  const currentYear = new Date().getFullYear();
  for(let yy=currentYear-5; yy<=currentYear+5; yy++){ const opt=document.createElement('option'); opt.value=yy; opt.textContent=yy; if(yy===y) opt.selected=true; selYear.appendChild(opt); }
  selMonth.innerHTML='';
  for(let mm=0; mm<12; mm++){ const opt=document.createElement('option'); opt.value=mm; opt.textContent=new Date(0,mm).toLocaleString(undefined,{month:'long'}); if(mm===m) opt.selected=true; selMonth.appendChild(opt); }
  populateDays(y,m,d);
}
function populateDays(y,m,selectedD){ selDay.innerHTML=''; const days = new Date(y,m+1,0).getDate(); for(let dd=1; dd<=days; dd++){ const opt=document.createElement('option'); opt.value=dd; opt.textContent=dd; if(dd===selectedD) opt.selected=true; selDay.appendChild(opt);} }

function openAddModal(editObj){ modalBg.style.display='flex'; document.getElementById('modalTitle').textContent = editObj ? 'Edit Event' : 'Add Event'; document.getElementById('evtTitle').value = editObj ? editObj.title : ''; document.getElementById('evtDesc').value = editObj ? editObj.description : ''; const y = editObj ? editObj.year : selectedDate.getFullYear(); const m = editObj ? editObj.month : selectedDate.getMonth(); const d = editObj ? editObj.day : selectedDate.getDate(); fillYearMonthDaySelectors(y,m,d); document.getElementById('evtTime').value = editObj ? editObj.time : (('00'+selectedDate.getHours()).slice(-2)+':'+('00'+selectedDate.getMinutes()).slice(-2)); document.getElementById('saveEvent').dataset.editId = editObj ? editObj.id : ''; }

function saveEvent(){ const title = document.getElementById('evtTitle').value.trim(); const desc = document.getElementById('evtDesc').value.trim(); const year = parseInt(selYear.value,10); const month = parseInt(selMonth.value,10); const day = parseInt(selDay.value,10); let time = document.getElementById('evtTime').value.trim(); if(!/^\d{1,2}:\d{2}$/.test(time)){ alert('Time format must be HH:MM'); return; } const parts = time.split(':'); const hh = Math.max(0, Math.min(23, parseInt(parts[0],10))); const mm = Math.max(0, Math.min(59, parseInt(parts[1],10))); time = pad(hh)+':'+pad(mm); if(title.length===0){ alert('Please add a title'); return; } const editId = document.getElementById('saveEvent').dataset.editId; if(editId){ db.ref('calendarEvents/' + editId).update({ title, description: desc, year, month, day, time, updatedAt: Date.now() }); modalBg.style.display='none'; document.getElementById('saveEvent').dataset.editId = ''; } else { const newRef = db.ref('calendarEvents').push(); newRef.set({ title, description: desc, year, month, day, time, createdAt: Date.now() }); modalBg.style.display='none'; } }

function listenEvents(){ const ref = db.ref('calendarEvents'); ref.on('value', snap => { const val = snap.val() || {}; eventsCache = {}; Object.keys(val).forEach(id => { eventsCache[id] = Object.assign({ id }, val[id]); }); renderCalendar(); updateSelectedDate(); }); }

function renderCalendar(){ daysGrid.innerHTML=''; const y = viewDate.getFullYear(); const m = viewDate.getMonth(); monthYearLabel.textContent = viewDate.toLocaleString(undefined,{month:'long', year:'numeric'}); const firstDayIndex = new Date(y,m,1).getDay(); const daysInMonth = new Date(y,m+1,0).getDate(); for(let i=0;i<firstDayIndex;i++){ const el=document.createElement('div'); el.className='dayCell'; el.style.opacity='0.25'; daysGrid.appendChild(el);} for(let d=1; d<=daysInMonth; d++){ const el=document.createElement('div'); el.className='dayCell'; const dt = new Date(y,m,d); const dayNum = document.createElement('div'); dayNum.className='dayNumber'; dayNum.textContent=d; el.appendChild(dayNum); const has = hasEventsOn(y,m,d); if(has){ const dot=document.createElement('div'); dot.className='hasEventDot'; el.appendChild(dot);} const today = new Date(); if(today.getFullYear()===y && today.getMonth()===m && today.getDate()===d){ el.classList.add('today'); } el.addEventListener('click', ()=> { selectedDate = dt; updateSelectedDate(); }); daysGrid.appendChild(el); } }

function hasEventsOn(year,month,day){ for(const id in eventsCache){ const e = eventsCache[id]; if(e.year===year && e.month===month && e.day===day) return true; } return false; }

function updateSelectedDate(){ selectedDateLabel.textContent = selectedDate.toDateString(); fillYearMonthDaySelectors(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate()); const arr = []; for(const id in eventsCache){ const e = eventsCache[id]; if(e.year===selectedDate.getFullYear() && e.month===selectedDate.getMonth() && e.day===selectedDate.getDate()){ arr.push(Object.assign({id}, e)); } } arr.sort((a,b)=> (a.time||'00:00').localeCompare(b.time||'00:00')); eventsList.innerHTML=''; if(arr.length===0) eventsList.innerHTML = '<div class="mutedSmall">No events for selected date.</div>'; arr.forEach(e => { const div=document.createElement('div'); div.className='eventItem'; div.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><div><strong>${escapeHtml(e.title)}</strong><div class="small">${e.time || ''}</div></div><div style="display:flex;flex-direction:column;gap:6px"><button class="codeBtn" style="padding:6px 8px;font-size:12px" onclick="viewEvent('${e.id}')">View</button><button class="codeBtn" style="padding:6px 8px;font-size:12px;background:#222;color:#fff" onclick="editEvent('${e.id}')">Edit</button><button class="codeBtn" style="padding:6px 8px;font-size:12px;background:transparent;border:1px solid rgba(255,255,255,0.06)" onclick="deleteEvent('${e.id}')">Delete</button></div></div><div class="small" style="margin-top:6px">${escapeHtml(e.description || '')}</div>`; eventsList.appendChild(div); }); }

window.viewEvent = function(id){ const e = eventsCache[id]; if(!e) return alert('Event not found'); alert(`Title: ${e.title}\nTime: ${e.time}\nDate: ${e.year}-${e.month+1}-${e.day}\n\n${e.description || ''}`); }
window.editEvent = function(id){ const e = eventsCache[id]; if(!e) return alert('Event not found'); openAddModal(Object.assign({ id }, e)); }
window.deleteEvent = function(id){ if(!confirm('Delete this event?')) return; db.ref('calendarEvents/' + id).remove(); }

function initializeCalendar(){ if(calendarInitialized) return; calendarInitialized=true; renderCalendar(); updateSelectedDate(); listenEvents(); }

function escapeHtml(str){ return String(str).replace(/[&<>\"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s])); }

window.addEventListener('load', ()=> { /* nothing extra */ });
</script>
</body>
</html>
