<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Login, Report, Shop & Credits Sender with Dynamic Island + Notifications</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b4c7e">
<link rel="apple-touch-icon" href="LABUBU3.jpg">

<style>
/* ---------- existing styles kept (trimmed in this paste) ---------- */
/* I kept your original styles. The new styles for the device picker and notch are below. */

/* Device picker modal (one-time) */
#devicePickerOverlay {
  position: fixed;
  inset: 0;
  display: none;
  align-items:center;
  justify-content:center;
  background: rgba(0,0,0,0.6);
  z-index: 200000;
}
#devicePickerCard {
  background: #fff;
  padding: 18px;
  border-radius: 12px;
  width: 320px;
  max-width: calc(100% - 32px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}
#devicePickerCard h3 { margin:0 0 8px 0; color:#2b4c7e; }
#devicePickerCard select, #devicePickerCard button { width:100%; padding:10px; margin-top:8px; font-size:1rem; border-radius:8px; }

/* Notch & in-notch island adjustments */
:root {
  --notch-width: 220px;   /* default, overridden per device */
  --notch-height: 36px;
  --island-closed-width: 220px;
}

/* Notch container (visual simulation) */
#notchContainer {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: var(--notch-width);
  height: var(--notch-height);
  background: #111;
  border-bottom-left-radius: 12px;
  border-bottom-right-radius: 12px;
  z-index: 99999;
  display: none; /* shown for notch devices */
  box-shadow: 0 4px 18px rgba(0,0,0,0.35), inset 0 -2px 6px rgba(255,255,255,0.03);
}

/* When island is placed "in-notch" we reduce its closed width and position it slightly lower */
#dynamic-island.in-notch {
  left: 50% !important;
  transform: translateX(-50%) !important;
  top: calc(var(--notch-height) - 6px) !important; /* a bit down inside notch */
  min-width: 0 !important;
  width: var(--island-closed-width) !important;
  background: var(--island-bg);
  z-index: 100000;
  border-radius: 14px;
  transition: width 600ms cubic-bezier(.22,1,.36,1), left 400ms ease, top 300ms ease;
}

/* When open, island still expands like normal; JS will compute a wider width and position the island menu */
#dynamic-island.in-notch.opening {
  /* width is set dynamically by JS when opening */
}

/* Ensure the actual island menu shows under the opened island (same as normal) */
#islandMenu.in-notch {
  top: calc(var(--notch-height) + 8px) !important;
}

/* small "Change device" control inside customize panel */
#changeDeviceBtn { margin-top: 10px; padding:8px; border-radius:8px; background: #fff; color:#2b4c7e; border:1px solid #cfd8e3; cursor:pointer; }

/* keep rest of your styles intact - omitted to keep this snippet readable */
</style>
</head>
<body>

<!-- Device picker modal (one-time) -->
<div id="devicePickerOverlay" role="dialog" aria-modal="true">
  <div id="devicePickerCard" role="document">
    <h3>Which device are you on?</h3>
    <p style="margin:6px 0 0 0; font-size:0.95rem; color:#444;">Choose your phone model so the Dynamic Island can display correctly. We'll only ask once.</p>
    <select id="devicePickerSelect" aria-label="Choose device">
      <option value="">Select device</option>
      <option value="iphone8">iPhone 8 — No notch</option>
      <option value="iphonex">iPhone X — Notch</option>
      <option value="iphone11">iPhone 11 — Notch</option>
      <option value="iphone13pro">iPhone 13 Pro — Notch</option>
    </select>
    <button id="saveDeviceBtn">Save device</button>
    <button id="skipDeviceBtn" style="margin-top:6px; background:#eee; color:#222; border:1px solid #ddd;">Skip (use default)</button>
  </div>
</div>

<!-- Notch visual (only shown for notch devices) -->
<div id="notchContainer" aria-hidden="true"></div>

<!-- (rest of your page content, dynamic island, menus, login form etc. — use your existing HTML unchanged) -->
<!-- For brevity I assume the rest of your original HTML (dynamic island, menus, forms) remains exactly as you provided. -->
<!-- ... your entire existing HTML goes here (kept exactly as you already had) ... -->

<!-- For the answer I will include only the additional script to integrate the picker and notch behaviour.
     Insert this <script> AFTER your initial module that creates and manipulates #dynamic-island
     (or replace the module version with this integrated version). -->

<script>
/*
  Device picker + notch-aware dynamic island behaviour

  How it works:
  - Shows the device picker once (no value in localStorage).
  - On selection we save 'deviceType' (string) to localStorage.
  - For notched devices we simulate a notch (#notchContainer), set CSS variables for notch size,
    and add class 'in-notch' to #dynamic-island so it sits in the notch when closed.
  - When opening/closing the island we respect the notch anchoring: closed width = notch width,
    expanded width computed by available viewport and the islandMenu logic.
*/

(function(){
  const DEVICE_KEY = 'labubu_device_type';
  const deviceInfo = {
    iphone8: { name: 'iPhone 8', notch: false, notchWidth: 0, notchHeight: 0 },
    iphonex: { name: 'iPhone X', notch: true, notchWidth: 220, notchHeight: 36 },
    iphone11: { name: 'iPhone 11', notch: true, notchWidth: 240, notchHeight: 36 },
    iphone13pro: { name: 'iPhone 13 Pro', notch: true, notchWidth: 200, notchHeight: 34 }
  };

  const pickerOverlay = document.getElementById('devicePickerOverlay');
  const pickerSelect = document.getElementById('devicePickerSelect');
  const saveBtn = document.getElementById('saveDeviceBtn');
  const skipBtn = document.getElementById('skipDeviceBtn');
  const notchContainer = document.getElementById('notchContainer');
  const islandEl = document.getElementById('dynamic-island');
  const islandMenu = document.getElementById('islandMenu');

  function showPicker(){
    pickerOverlay.style.display = 'flex';
  }
  function hidePicker(){
    pickerOverlay.style.display = 'none';
  }

  function setDevice(deviceKey){
    if(!deviceKey || !deviceInfo[deviceKey]) {
      localStorage.setItem(DEVICE_KEY, '');
      applyDevice(null);
      return;
    }
    localStorage.setItem(DEVICE_KEY, deviceKey);
    applyDevice(deviceKey);
  }

  function applyDevice(deviceKey){
    const d = deviceInfo[deviceKey] || null;
    if(!d || !d.notch){
      // Non-notch device: hide notch visual and ensure island is centered normally
      notchContainer.style.display = 'none';
      islandEl.classList.remove('in-notch');
      islandMenu.classList.remove('in-notch');
      // clear CSS variables
      document.documentElement.style.removeProperty('--notch-width');
      document.documentElement.style.removeProperty('--notch-height');
      document.documentElement.style.removeProperty('--island-closed-width');
      // Reset island inline positioning to the default behaviour (centered)
      islandEl.style.left = ''; islandEl.style.top = ''; islandEl.style.transform = '';
      return;
    }

    // Notch device: show notch and anchor island inside it when closed
    document.documentElement.style.setProperty('--notch-width', `${d.notchWidth}px`);
    document.documentElement.style.setProperty('--notch-height', `${d.notchHeight}px`);
    document.documentElement.style.setProperty('--island-closed-width', `${d.notchWidth}px`);
    notchContainer.style.width = `${d.notchWidth}px`;
    notchContainer.style.height = `${d.notchHeight}px`;
    notchContainer.style.display = 'block';
    islandEl.classList.add('in-notch');
    islandMenu.classList.add('in-notch');

    // position island so it's aligned with notch center and slightly lower (CSS takes care of top)
    islandEl.style.left = '50%';
    islandEl.style.transform = 'translateX(-50%)';
    islandEl.style.top = `calc(${d.notchHeight}px - 6px)`;
    islandEl.style.width = `${d.notchWidth}px`;
  }

  // load saved and initialize
  const saved = localStorage.getItem(DEVICE_KEY);
  if(!saved){
    // show once after DOM ready
    window.addEventListener('load', ()=> {
      setTimeout(()=> showPicker(), 420);
    });
  } else if(deviceInfo[saved]){
    applyDevice(saved);
  }

  // Save actions
  saveBtn.addEventListener('click', ()=> {
    const deviceKey = pickerSelect.value;
    if(!deviceKey) { alert('Please choose a device'); return; }
    setDevice(deviceKey);
    hidePicker();
  });
  skipBtn.addEventListener('click', ()=> {
    hidePicker();
    // leave default styling (centered)
  });

  // Additionally add a "Change device" small button inside customize panel if present
  // So user can change later without clearing localStorage.
  function ensureChangeButton(){
    try{
      const panelCustomize = document.getElementById('panelCustomize');
      if(!panelCustomize) return;
      if(document.getElementById('changeDeviceBtn')) return;
      const btn = document.createElement('button');
      btn.id = 'changeDeviceBtn';
      btn.textContent = 'Change device';
      btn.addEventListener('click', ()=> {
        // pre-select the saved device
        const cur = localStorage.getItem(DEVICE_KEY) || '';
        pickerSelect.value = cur;
        showPicker();
      });
      panelCustomize.querySelector('.panel-inner').appendChild(btn);
    }catch(e){}
  }
  // run after page loaded (panel might be created earlier)
  window.addEventListener('load', ensureChangeButton);
  setTimeout(ensureChangeButton, 800);

  /* ---------- Update the island open/close logic to respect notch anchor ---------- */
  // The page already had island open/close logic in its module. We override behavior by hooking into click:
  // We will re-implement opening/closing in a way compatible with notched devices.
  // To avoid interfering with the page module scope, we add a new listener that toggles classes and positions menu.
  // This listener co-exists with the page's listener, so we first prevent duplicate actions by checking the presence of the islandMenu class.
  let isIslandOpen = false;
  // store closed width for restoring
  function getClosedWidth(){
    const deviceKey = localStorage.getItem(DEVICE_KEY);
    if(deviceInfo[deviceKey] && deviceInfo[deviceKey].notch) return deviceInfo[deviceKey].notchWidth;
    // fallback: compute natural closed width (current bounding rect)
    return Math.round(islandEl.getBoundingClientRect().width || 180);
  }

  function computeMenuWidth(){
    // Similar to original behavior: allow at most min(windowWidth-20, 520), adjust for very small screens
    let maxAllowed = Math.min(window.innerWidth - 20, 520);
    if(window.innerWidth <= 420) maxAllowed = Math.min(window.innerWidth - 20, 380);
    const menuWidth = Math.max(Math.min(maxAllowed, 520), 320);
    return menuWidth;
  }

  function openIslandCustom(){
    if(isIslandOpen) return;
    const rect = islandEl.getBoundingClientRect();
    const closedWidth = rect.width;
    islandEl.dataset.closedWidth = closedWidth;

    const menuWidth = computeMenuWidth();

    // If notch device, keep island horizontally centered on notch while expanding width to menuWidth,
    // but if menuWidth would overflow left/right too much we clamp it.
    const deviceKey = localStorage.getItem(DEVICE_KEY);
    const hasNotch = deviceInfo[deviceKey] && deviceInfo[deviceKey].notch;

    // compute target left for the island element (so it visually expands from the notch center)
    if(hasNotch){
      // island stays centered with transform translateX(-50%). To visually expand, we set its width to menuWidth
      islandEl.style.width = `${menuWidth}px`;
      // ensure island left remains 50% and transform keeps centered:
      islandEl.style.left = '50%';
      islandEl.style.transform = 'translateX(-50%)';
    } else {
      // Non-notch: center in viewport (same as original)
      const left = Math.round((window.innerWidth - menuWidth) / 2);
      islandEl.style.left = `${left}px`;
      islandEl.style.width = `${menuWidth}px`;
      islandEl.style.transform = '';
    }

    // now position the islandMenu (dialog) under the island — reuse earlier menu positioning logic
    // compute menu left and top
    const islandRect = islandEl.getBoundingClientRect();
    let menuLeft = Math.round((window.innerWidth - menuWidth) / 2);
    // position menu top below island
    let menuTop = Math.round(islandRect.bottom + 8);

    // apply to islandMenu
    islandMenu.style.left = `${menuLeft}px`;
    islandMenu.style.top = `${menuTop}px`;
    islandMenu.style.width = `${menuWidth}px`;
    islandMenu.classList.add('open');
    islandMenu.setAttribute('aria-hidden', 'false');

    islandEl.classList.add('opening');
    isIslandOpen = true;
    // mark for potential other logic
    islandEl.dataset.opened = '1';
    // highlight actions button if needed (original code handled active classes)
    try{ document.getElementById('menuShopBtn').classList.add('active'); }catch(e){}
  }

  function closeIslandCustom(){
    if(!isIslandOpen) return;
    islandMenu.classList.remove('open');
    islandMenu.setAttribute('aria-hidden', 'true');
    // restore closed width/position
    const closedWidth = islandEl.dataset.closedWidth || '';
    const deviceKey = localStorage.getItem(DEVICE_KEY);
    const hasNotch = deviceInfo[deviceKey] && deviceInfo[deviceKey].notch;
    if(closedWidth){
      islandEl.style.width = `${closedWidth}px`;
      if(hasNotch){
        islandEl.style.left = '50%';
        islandEl.style.transform = 'translateX(-50%)';
        // top stays anchored in notch
      } else {
        islandEl.style.left = '';
        islandEl.style.transform = '';
      }
      // cleanup
      setTimeout(()=> { islandEl.style.width = ''; islandEl.removeAttribute('data-opened'); islandEl.classList.remove('opening'); }, 420);
    } else {
      // fallback: fully reset
      islandEl.style.left = ''; islandEl.style.width = ''; islandEl.style.transform = '';
      islandEl.classList.remove('opening');
    }
    isIslandOpen = false;
    try{ document.querySelectorAll('.menu-actions button').forEach(b => b.classList.remove('active')); }catch(e){}
  }

  // Wire custom click toggling on island: a single click toggles open/close
  islandEl.addEventListener('click', (ev) => {
    // If click target is inside menu itself, ignore
    // Toggle open/close
    if(isIslandOpen) closeIslandCustom();
    else openIslandCustom();
    // prevent other click handlers (some module code may also run)
    ev.stopPropagation();
  });

  // close when clicking outside
  document.addEventListener('click', (e) => {
    if(!isIslandOpen) return;
    if(!islandEl.contains(e.target) && !islandMenu.contains(e.target)) {
      closeIslandCustom();
    }
  });

  // update layout on resize
  window.addEventListener('resize', ()=> {
    // reapply saved device (which updates notch size)
    const savedDevice = localStorage.getItem(DEVICE_KEY);
    if(savedDevice) applyDevice(savedDevice);
    // if open, reposition
    if(isIslandOpen){
      const menuWidth = computeMenuWidth();
      islandMenu.style.width = `${menuWidth}px`;
      // center island/menu again
      const deviceKey = localStorage.getItem(DEVICE_KEY);
      const hasNotch = deviceInfo[deviceKey] && deviceInfo[deviceKey].notch;
      if(hasNotch){
        islandEl.style.width = `${menuWidth}px`;
        islandEl.style.left = '50%';
        islandEl.style.transform = 'translateX(-50%)';
      } else {
        const left = Math.round((window.innerWidth - menuWidth) / 2);
        islandEl.style.left = `${left}px`;
        islandEl.style.width = `${menuWidth}px`;
        islandEl.style.transform = '';
        islandMenu.style.left = `${left}px`;
      }
      // recompute menu top from island bounding rect
      const islandRect = islandEl.getBoundingClientRect();
      islandMenu.style.top = Math.round(islandRect.bottom + 8) + 'px';
    } else {
      // if closed, ensure closed width = notchWidth for notch devices
      const savedDevice = localStorage.getItem(DEVICE_KEY);
      const d = deviceInfo[savedDevice];
      if(d && d.notch){
        islandEl.style.width = `${d.notchWidth}px`;
        islandEl.style.left = '50%';
        islandEl.style.transform = 'translateX(-50%)';
        islandEl.style.top = `calc(${d.notchHeight}px - 6px)`;
      }
    }
  });

  // expose small API: allow clearing the saved device in console if needed
  window.LabubuDevice = {
    clear() { localStorage.removeItem(DEVICE_KEY); alert('Device selection cleared — will ask again on next load.'); }
  };

})();
</script>
