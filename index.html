<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>HackerBoard — Updates / Trello-like</title>
<style>
  :root{
    --bg:#07100a;
    --panel:#021006;
    --accent:#00ff6a;
    --muted:#0b3a26;
    --card:#082215;
    --danger:#ff4d4d;
    --glass: rgba(255,255,255,0.02);
    --glass-2: rgba(0,0,0,0.3);
  }
  html,body{height:100%;margin:0;font-family: "Courier New", Courier, monospace;background:linear-gradient(90deg,#001200 0%, #002200 50%, #001200 100%); color:var(--accent); -webkit-font-smoothing:antialiased;}
  /* matrix background lines */
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none;
    background-image: linear-gradient(transparent 92%, rgba(0,255,110,0.02) 92%),
                      linear-gradient(90deg, transparent 93%, rgba(0,255,110,0.02) 93%);
    background-size: 100% 32px, 32px 100%;
    mix-blend-mode: overlay;
  }
  .app {
    padding:14px;
    box-sizing:border-box;
    height:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .topbar{
    display:flex; gap:12px; align-items:center;
  }
  .logo{
    font-weight:800; font-size:18px; color:var(--accent); letter-spacing:1px;
    background: linear-gradient(90deg, rgba(0,255,110,0.12), rgba(0,255,110,0.02));
    padding:8px 12px; border-radius:6px; box-shadow:0 4px 12px rgba(0,255,110,0.03);
  }
  .controls { display:flex; gap:8px; align-items:center; margin-left:auto; }
  input.code {
    background:transparent; border:1px solid rgba(0,255,110,0.12); color:var(--accent);
    padding:6px 8px; border-radius:6px; width:80px; text-align:center;
  }
  button.btn {
    background:linear-gradient(180deg, rgba(0,255,110,0.06), rgba(0,255,110,0.02));
    color:var(--accent); border:1px solid rgba(0,255,110,0.15); padding:8px 12px; border-radius:6px;
    cursor:pointer; font-weight:700;
  }
  button.btn:disabled{opacity:0.45; cursor:not-allowed;}
  .status-pill { padding:4px 8px; border-radius:999px; font-size:12px; font-weight:700; }
  .board {
    display:flex;
    gap:12px;
    align-items:flex-start;
    overflow:auto;
    padding:8px;
  }
  .part {
    min-width:260px;
    background:linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.45));
    border-radius:10px; padding:10px; box-shadow: 0 8px 40px rgba(0,0,0,0.6); border:1px solid rgba(0,255,110,0.04);
  }
  .part-header { display:flex; gap:6px; align-items:center; margin-bottom:8px; }
  .part-title { font-weight:800; font-size:14px; }
  .part-actions { margin-left:auto; display:flex; gap:6px; }
  .part-admin { font-size:11px; color:#00ff6a; opacity:0.85; background:rgba(0,0,0,0.2); padding:4px 6px; border-radius:6px; }
  .cards { display:flex; flex-direction:column; gap:8px; }
  .card {
    background: linear-gradient(180deg, rgba(0,255,110,0.02), rgba(0,255,110,0.006));
    border:1px solid rgba(0,255,110,0.06); padding:10px; border-radius:8px;
    color:#bfffd6;
  }
  .card .title { font-weight:800; margin-bottom:6px; }
  .card .desc { font-size:12px; color:#a6f8bf; margin-bottom:8px; opacity:0.95; }
  .card .meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .small { font-size:12px; opacity:0.9; }
  .controls-2 { display:flex; gap:6px; margin-left:auto; }
  .status-Not\ Started{ background: rgba(255,255,255,0.03); color:#ffd; }
  .status-Being\ Made{ background: rgba(0,255,110,0.06); color: #b9ffd6; }
  .status-Confirmed{ background: rgba(0,200,100,0.08); color:#aaf3c7; }
  .status-Done{ background: rgba(0,160,60,0.08); color:#88f0b1; text-decoration:line-through; }
  .muted { color:#3a9a63; font-size:12px; }
  .ghost {
    border:1px dashed rgba(0,255,110,0.06); padding:8px; border-radius:6px; color:#97f7b8; background:linear-gradient(180deg, rgba(0,255,110,0.01), transparent);
  }

  /* hack overlay */
  .hack-overlay{
    position:fixed; inset:0; display:none; z-index:99999; backdrop-filter: blur(4px);
    background: linear-gradient(180deg, rgba(0,0,0,0.6), rgba(0,0,0,0.9));
    color:var(--accent); font-family: "Courier New", monospace;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
  }
  .hack-box{
    width:92%; max-width:900px; height:70%; background:#001a0d; border-radius:8px; padding:14px; overflow:auto; border:1px solid rgba(0,255,110,0.06);
  }
  .hack-feed { height:calc(100% - 36px); overflow:auto; font-size:12px; line-height:1.2; white-space:pre; color:#8cff9e; }
  .hack-footer { display:flex; gap:12px; align-items:center; justify-content:space-between; margin-top:6px; color:#9efbb0; }
  .green-big{ color:var(--accent); font-weight:800; font-size:20px; }

  /* responsive */
  @media (max-width:700px){
    .board { padding-bottom:60px; }
    .part { min-width:220px; }
    .topbar { flex-wrap:wrap; gap:8px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">HackerBoard • Updates</div>

    <div style="padding:8px 12px; border-radius:8px; border:1px solid rgba(0,255,110,0.03); background:rgba(0,0,0,0.25)">
      <span class="muted">Status:</span>
      <span id="adminStatus" class="small muted">Locked</span>
    </div>

    <div class="controls">
      <input id="codeInput" class="code" placeholder="code" value="" />
      <button id="unlockBtn" class="btn" title="Enter code 555 to unlock">Unlock</button>
      <button id="hackBtn" class="btn" title="Simulate a hack (10 minutes)">Hack</button>
      <button id="addPartBtn" class="btn" title="Add a new part (requires unlock)" disabled>Add Part</button>
    </div>
  </div>

  <div id="board" class="board" aria-live="polite"></div>

  <div style="font-size:12px; color:#94f7b5; opacity:0.9; margin-top:6px;">
    Tips: create parts (columns), then add cards inside. You can mark parts/cards as admin-only (hidden until unlock with code 555).
  </div>
</div>

<!-- hack overlay -->
<div id="hackOverlay" class="hack-overlay" role="dialog" aria-modal="true">
  <div class="hack-box">
    <div class="green-big">HACK SIMULATOR</div>
    <div id="hackFeed" class="hack-feed"></div>
    <div class="hack-footer">
      <div id="hackTimer" class="small">10:00</div>
      <div class="muted">Keep this tab open. Hacking will run for 10 minutes. (This is simulation — it does not unlock admin features.)</div>
      <button id="stopHackBtn" class="btn">Abort Hack</button>
    </div>
  </div>
</div>

<script>
/* ---------- Data model & storage ---------- */
const STORAGE_KEY = 'hackerboard_data_v1';
const ADMIN_KEY = 'hackerboard_admin_unlocked_session'; // stored in sessionStorage for the session
let state = {
  parts: []
};

// sample initial data (one public part and one admin-only part)
const sample = [
  { id: genId(), title: "Public Updates", adminOnly: false, cards: [
      { id: genId(), title: "Website skeleton", desc: "Initial framework & design", status: "Being Made", adminOnly: false },
      { id: genId(), title: "Design green theme", desc: "Hacker green look", status: "Not Started", adminOnly: false }
    ]},
  { id: genId(), title: "Admin Abuse (private)", adminOnly: true, cards: [
      { id: genId(), title: "Investigate logs", desc: "Check for suspicious admin actions", status: "Not Started", adminOnly:true },
      { id: genId(), title: "Privileged card", desc: "Secret plan", status: "Confirmed", adminOnly:true }
    ]}
];

function genId(){ return 'id_' + Math.random().toString(36).slice(2,9); }

function loadState(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      state = JSON.parse(raw);
    }catch(e){
      console.error("failed parse storage", e);
      state = { parts: [] };
    }
  } else {
    state.parts = sample;
    saveState();
  }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

/* ---------- Admin unlock logic ---------- */
let adminUnlocked = sessionStorage.getItem(ADMIN_KEY) === '1';

const codeInput = document.getElementById('codeInput');
const unlockBtn = document.getElementById('unlockBtn');
const addPartBtn = document.getElementById('addPartBtn');
const adminStatus = document.getElementById('adminStatus');

function setAdminUnlocked(val){
  adminUnlocked = !!val;
  sessionStorage.setItem(ADMIN_KEY, adminUnlocked ? '1' : '0');
  adminStatus.textContent = adminUnlocked ? 'Admin: unlocked' : 'Locked';
  addPartBtn.disabled = !adminUnlocked;
  renderBoard();
}

unlockBtn.addEventListener('click', ()=>{
  const code = codeInput.value.trim();
  if(code === '555'){
    setAdminUnlocked(true);
    flashNotice("Unlocked: admin features enabled");
    codeInput.value = '';
  } else {
    flashNotice("Wrong code");
  }
});
codeInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter') unlockBtn.click();
});

/* ---------- UI rendering ---------- */
const boardEl = document.getElementById('board');

function renderBoard(){
  boardEl.innerHTML = '';
  if(state.parts.length === 0){
    boardEl.innerHTML = '<div class="ghost">No parts yet. Add a part to start.</div>';
    return;
  }
  state.parts.forEach(part => {
    // skip adminOnly parts if not unlocked
    if(part.adminOnly && !adminUnlocked) return;

    const partEl = document.createElement('div');
    partEl.className = 'part';
    partEl.dataset.partId = part.id;
    partEl.innerHTML = `
      <div class="part-header">
        <div class="part-title">${escapeHtml(part.title)}</div>
        ${part.adminOnly ? '<div class="part-admin">ADMIN</div>' : ''}
        <div class="part-actions">
          <button class="btn editPartBtn">Edit</button>
          <button class="btn delPartBtn">Delete</button>
          <button class="btn addCardBtn" ${adminUnlocked ? '' : 'disabled'}>Add Card</button>
        </div>
      </div>
      <div class="cards"></div>
    `;
    const cardsContainer = partEl.querySelector('.cards');

    // render each card
    (part.cards || []).forEach(card=>{
      if(card.adminOnly && !adminUnlocked) return;
      const cardEl = document.createElement('div');
      cardEl.className = 'card';
      cardEl.dataset.cardId = card.id;
      cardEl.innerHTML = `
        <div class="title">${escapeHtml(card.title)}</div>
        <div class="desc">${escapeHtml(card.desc || '')}</div>
        <div class="meta">
          <div class="status-pill status-${escapeHtml(card.status)}">${escapeHtml(card.status)}</div>
          ${card.adminOnly ? '<div class="small">[admin]</div>' : ''}
          <div class="controls-2" style="margin-left:auto">
            <select class="statusSelect small">
              <option>Not Started</option>
              <option>Being Made</option>
              <option>Confirmed</option>
              <option>Done</option>
            </select>
            <button class="btn editCardBtn small">Edit</button>
            <button class="btn delCardBtn small" style="background:rgba(255,77,77,0.06); border-color:rgba(255,77,77,0.12);">Delete</button>
          </div>
        </div>
      `;
      // set the select value
      const sel = cardEl.querySelector('.statusSelect');
      sel.value = card.status;

      // event bindings
      sel.addEventListener('change', ()=>{
        card.status = sel.value;
        saveState();
        renderBoard();
      });

      cardEl.querySelector('.editCardBtn').addEventListener('click', ()=> openEditCardModal(part.id, card.id));
      cardEl.querySelector('.delCardBtn').addEventListener('click', ()=> {
        if(confirm('Delete this card?')) {
          part.cards = part.cards.filter(c=>c.id !== card.id);
          saveState(); renderBoard();
        }
      });

      cardsContainer.appendChild(cardEl);
    });

    // part actions
    partEl.querySelector('.addCardBtn').addEventListener('click', ()=> openAddCardModal(part.id));
    partEl.querySelector('.delPartBtn').addEventListener('click', ()=>{
      if(confirm('Delete this part and all its cards?')) {
        state.parts = state.parts.filter(p=>p.id !== part.id);
        saveState(); renderBoard();
      }
    });
    partEl.querySelector('.editPartBtn').addEventListener('click', ()=> openEditPartModal(part.id));

    boardEl.appendChild(partEl);
  });
}

/* ---------- helpers ---------- */
function escapeHtml(s){ return (s+'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

function flashNotice(t){
  // quick console-like flash
  const el = document.createElement('div');
  el.textContent = t;
  el.style.position='fixed'; el.style.right='18px'; el.style.bottom='18px';
  el.style.background='rgba(0,0,0,0.6)'; el.style.color='var(--accent)';
  el.style.padding='8px 12px'; el.style.borderRadius='8px'; el.style.zIndex=99999;
  document.body.appendChild(el);
  setTimeout(()=> el.remove(),2200);
}

/* ---------- Add / Edit modals (built with prompt() to keep single file) ---------- */
function openAddCardModal(partId){
  const part = state.parts.find(p=>p.id===partId);
  if(!part) return;
  if(!adminUnlocked){ flashNotice('Add Card requires admin unlock'); return; }

  const title = prompt('Card title:');
  if(!title) return;
  const desc = prompt('Card description:') || '';
  const isAdminOnly = confirm('Make this card admin-only (hidden until unlock)? OK = yes, Cancel = no');
  const card = { id: genId(), title: title.trim(), desc: desc.trim(), status: 'Not Started', adminOnly: !!isAdminOnly };
  part.cards = part.cards || [];
  part.cards.push(card);
  saveState(); renderBoard();
}

function openEditCardModal(partId, cardId){
  const part = state.parts.find(p=>p.id===partId);
  if(!part) return;
  const card = part.cards.find(c=>c.id===cardId);
  if(!card) return;
  if(card.adminOnly && !adminUnlocked){ flashNotice('Cannot edit admin-only card while locked'); return; }
  const title = prompt('Edit card title:', card.title);
  if(title === null) return;
  const desc = prompt('Edit description:', card.desc || '') || '';
  const makeAdmin = confirm('Make admin-only? OK = yes, Cancel = no');
  card.title = title.trim();
  card.desc = desc.trim();
  card.adminOnly = !!makeAdmin;
  saveState(); renderBoard();
}

function openEditPartModal(partId){
  const part = state.parts.find(p=>p.id===partId);
  if(!part) return;
  const title = prompt('Edit part title:', part.title);
  if(title === null) return;
  const makeAdmin = confirm('Make this part admin-only? OK = yes, Cancel = no');
  part.title = title.trim();
  part.adminOnly = !!makeAdmin;
  saveState(); renderBoard();
}

/* ---------- Add Part button ---------- */
addPartBtn.addEventListener('click', ()=>{
  if(!adminUnlocked){ flashNotice('Add Part requires admin unlock'); return; }
  const title = prompt('Part (column) title:');
  if(!title) return;
  const makeAdmin = confirm('Make this part admin-only? OK = yes, Cancel = no');
  state.parts.push({ id: genId(), title: title.trim(), adminOnly: !!makeAdmin, cards: [] });
  saveState(); renderBoard();
});

/* ---------- initial load ---------- */
loadState();
setAdminUnlocked(adminUnlocked);
renderBoard();

/* ---------- Hack simulator (10 minutes) ---------- */
const hackBtn = document.getElementById('hackBtn');
const hackOverlay = document.getElementById('hackOverlay');
const hackFeed = document.getElementById('hackFeed');
const hackTimer = document.getElementById('hackTimer');
const stopHackBtn = document.getElementById('stopHackBtn');

let hackInterval = null;
let hackStart = null;
let hackDurationSec = 10 * 60; // 10 minutes = 600 sec
let hackTickerInterval = null;

function startHack(){
  if(hackInterval) return;
  hackOverlay.style.display = 'flex';
  hackFeed.textContent = '';
  hackStart = Date.now();
  let seed = 0;
  // generate lots of numbers in stream
  hackInterval = setInterval(()=>{
    seed++;
    const lines = [];
    for(let i=0;i<6;i++){
      const hex = Math.floor(Math.random()*0xffffffff).toString(16).padStart(8,'0');
      const num = Math.floor(Math.random()*1e12).toString().padStart(12,'0');
      lines.push(`[${new Date().toLocaleTimeString()}] 0x${hex} ${num}`);
    }
    hackFeed.textContent = (hackFeed.textContent + lines.join('\n') + '\n').slice(-3000);
    hackFeed.scrollTop = hackFeed.scrollHeight;
  }, 450);

  // timer
  hackTickerInterval = setInterval(()=>{
    const elapsed = Math.floor((Date.now() - hackStart)/1000);
    const remain = hackDurationSec - elapsed;
    if(remain <= 0){
      stopHack(true);
      return;
    }
    const mm = String(Math.floor(remain/60)).padStart(2,'0');
    const ss = String(remain%60).padStart(2,'0');
    hackTimer.textContent = `${mm}:${ss} remaining`;
  }, 700);

  // safety: update initial timer immediately
  hackTimer.textContent = `${String(Math.floor(hackDurationSec/60)).padStart(2,'0')}:${String(hackDurationSec%60).padStart(2,'0')} remaining`;
}

function stopHack(finished=false){
  if(hackInterval){ clearInterval(hackInterval); hackInterval = null; }
  if(hackTickerInterval){ clearInterval(hackTickerInterval); hackTickerInterval = null; }
  hackOverlay.style.display = 'none';
  if(finished){
    // the spec: hack runs 10 mins and shows numbers & minutes left; it should not unlock admin features.
    flashNotice('Hack finished (simulation). Admin features remain locked.');
  } else {
    flashNotice('Hack aborted.');
  }
}

hackBtn.addEventListener('click', ()=>{
  startHack();
});
stopHackBtn.addEventListener('click', ()=> stopHack(false));

/* ---------- keyboard shortcuts (fun) ---------- */
document.addEventListener('keydown', (e)=>{
  if(e.ctrlKey && e.key === 'u'){
    // quick unlock (shows prompt)
    const code = prompt('Enter admin code:');
    if(code === '555'){ setAdminUnlocked(true); flashNotice('Unlocked via shortcut'); }
    else flashNotice('Wrong code');
  }
});

/* ---------- small safety: prevent accidental clearing ---------- */
/* Provide a button to reset sample data (commented out) — left for debugging */
/*
function resetToSample(){
  state.parts = sample;
  saveState();
  renderBoard();
}
*/

/* ---------- end of file ---------- */
</script>
</body>
</html>
